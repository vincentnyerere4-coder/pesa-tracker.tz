
<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesa Tracker</title><style>body{background:#020617;color:#fff;font-family:Arial;padding:12px}.card{background:#0f172a;border-radius:16px;padding:18px;max-width:500px;margin:auto;border:1px solid #1e293b}h1{text-align:center;color:#22c55e}.balance{background:#052e16;border:1px solid #22c55e;border-radius:12px;padding:15px;text-align:center;margin:12px 0}.bal{font-size:28px;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cat{background:#1e293b;padding:10px;border-radius:10px;text-align:center;font-size:13px}.cat b{display:block;font-size:18px}input,select{width:100%;padding:12px;border-radius:10px;background:#020617;color:#fff;border:1px solid #334155;margin-top:8px;box-sizing:border-box}button{width:100%;padding:12px;background:#22c55e;color:#052e16;font-weight:bold;border:none;border-radius:10px;margin-top:10px;font-size:16px}.item{background:#1e293b;padding:8px 10px;border-radius:8px;margin-top:6px;display:flex;justify-content:space-between;font-size:13px}</style></head><body><div class="card"><h1>💰 PESA TRACKER</h1><div class="balance"><small>BAKI</small><div class="bal" id="bal">TZS 0</div><small id="used">0</small></div><input id="budget" type="number" placeholder="Bajeti ya Mwezi"><button onclick="setBudget()">WEKA BAJETI</button><div class="grid" style="margin-top:12px"><div class="cat">🍚 Msosi<b id="c-msosi">0</b></div><div class="cat">📱 Vocha<b id="c-vocha">0</b></div><div class="cat">📚 Chuo<b id="c-chuo">0</b></div><div class="cat">🍻 Mahonga<b id="c-mahonga">0</b></div><div class="cat">🚌 Usafiri<b id="c-usafiri">0</b></div><div class="cat">👕 Kujikimu<b id="c-kujikimu">0</b></div></div><select id="cat" style="margin-top:15px"><option value="msosi">Msosi</option><option value="vocha">Vocha</option><option value="chuo">Chuo</option><option value="mahonga">Mahonga</option><option value="usafiri">Usafiri</option><option value="kujikimu">Kujikimu</option></select><input id="amount" type="number" placeholder="Kiasi"><input id="desc" type="text" placeholder="Maelezo"><button onclick="addExp()">ONGEZA ➕</button><div id="list" style="margin-top:15px"></div><button onclick="clearAll()" style="background:#450a0a;color:#fca5a5">FUTA ZOTE</button></div><script>let budget=parseInt(localStorage.getItem('v_budget')||0),exps=JSON.parse(localStorage.getItem('v_exps')||'[]');function render(){let t=exps.reduce((s,e)=>s+e.amount,0);document.getElementById('bal').innerText='TZS '+(budget-t).toLocaleString();document.getElementById('used').innerText='Umetumia '+t+' / '+budget;let c={msosi:0,vocha:0,chuo:0,mahonga:0,usafiri:0,kujikimu:0};exps.forEach(e=>c[e.cat]+=e.amount);for(let k in c)document.getElementById('c-'+k).innerText=c[k];let l=document.getElementById('list');l.innerHTML='';exps.slice().reverse().forEach(e=>l.innerHTML+=`<div class="item"><span>${e.cat} - ${e.desc}</span><b>${e.amount}</b></div>`)}function setBudget(){let b=parseInt(document.getElementById('budget').value);if(!b)return;budget=b;localStorage.setItem('v_budget',b);render()}function addExp(){let C=document.getElementById('cat').value,A=parseInt(document.getElementById('amount').value),D=document.getElementById('desc').value||C;if(!A)return;exps.push({cat:C,amount:A,desc:D});localStorage.setItem('v_exps',JSON.stringify(exps));render()}function clearAll(){exps=[];localStorage.removeItem('v_exps');render()}render();</script></body></html>
